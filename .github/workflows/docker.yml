name: Build and Push Docker Images

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

env:
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract version
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build and push Auth service
        uses: docker/build-push-action@v6
        with:
          context: ./auth-service
          file: ./auth-service/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/auth-service:${{ steps.version.outputs.version }}
            ${{ env.DOCKERHUB_USERNAME }}/auth-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Notes service
        uses: docker/build-push-action@v6
        with:
          context: ./notes-service
          file: ./notes-service/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/notes-service:${{ steps.version.outputs.version }}
            ${{ env.DOCKERHUB_USERNAME }}/notes-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Gateway
        uses: docker/build-push-action@v6
        with:
          context: ./gateway
          file: ./gateway/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/gateway:${{ steps.version.outputs.version }}
            ${{ env.DOCKERHUB_USERNAME }}/gateway:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max