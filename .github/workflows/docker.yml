name: Build, Test, Push and Deploy Docker Images

on:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:

  # ==================================================
  # TEST AUTH + NOTES
  # ==================================================

  test:
    name: Test Auth and Notes
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # CHECKOUT
      # --------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # DOCKER
      # --------------------------------------------------

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # --------------------------------------------------
      # BUILD AUTH TEST IMAGE
      # --------------------------------------------------

      - name: Build Auth test image
        uses: docker/build-push-action@v6
        with:
          context: ./auth-service
          file: ./auth-service/Dockerfile
          load: true
          tags: auth-service:test
          build-args: |
            INSTALL_DEV=true

      # --------------------------------------------------
      # BUILD NOTES TEST IMAGE
      # --------------------------------------------------

      - name: Build Notes test image
        uses: docker/build-push-action@v6
        with:
          context: ./notes-service
          file: ./notes-service/Dockerfile
          load: true
          tags: notes-service:test
          build-args: |
            INSTALL_DEV=true

      # --------------------------------------------------
      # PINT - AUTH
      # --------------------------------------------------

      - name: Run Pint - Auth
        run: |
          docker run --rm auth-service:test ./vendor/bin/pint --test

      # --------------------------------------------------
      # PINT - NOTES
      # --------------------------------------------------

      - name: Run Pint - Notes
        run: |
          docker run --rm notes-service:test ./vendor/bin/pint --test

      # --------------------------------------------------
      # AUTH TESTS
      # --------------------------------------------------

      - name: Run Auth tests
        run: |
          docker run --rm auth-service:test php artisan test

      # --------------------------------------------------
      # NOTES TESTS
      # --------------------------------------------------

      - name: Run Notes tests
        run: |
          docker run --rm notes-service:test php artisan test


  # ==================================================
  # BUILD + PUSH
  # ==================================================

  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest

    needs:
      - test

    steps:

      # --------------------------------------------------
      # CHECKOUT
      # --------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # DOCKER
      # --------------------------------------------------

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # --------------------------------------------------
      # BUILD + PUSH AUTH
      # --------------------------------------------------

      - name: Build and push Auth service
        uses: docker/build-push-action@v6
        with:
          context: ./auth-service
          file: ./auth-service/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/auth-service:latest

      # --------------------------------------------------
      # BUILD + PUSH NOTES
      # --------------------------------------------------

      - name: Build and push Notes service
        uses: docker/build-push-action@v6
        with:
          context: ./notes-service
          file: ./notes-service/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/notes-service:latest

      # --------------------------------------------------
      # BUILD + PUSH GATEWAY
      # --------------------------------------------------

      - name: Build and push Gateway
        uses: docker/build-push-action@v6
        with:
          context: ./gateway
          file: ./gateway/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/gateway:latest


  # ==================================================
  # DEPLOY TO EC2
  # ==================================================

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    needs:
      - build-and-push

    steps:

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            set -e

            cd ~/notes-app

            echo "========================================="
            echo "Pulling latest Docker images..."
            echo "========================================="

            docker compose -f docker-compose.prod.yml pull

            echo "========================================="
            echo "Recreating containers..."
            echo "========================================="

            docker compose \
              -f docker-compose.prod.yml \
              up -d \
              --force-recreate

            echo "========================================="
            echo "Removing unused images..."
            echo "========================================="

            docker image prune -f

            echo "========================================="
            echo "Deployment completed."
            echo "========================================="

            docker compose \
              -f docker-compose.prod.yml \
              ps