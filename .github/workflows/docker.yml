name: Build, Push and Deploy Docker Images

on:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # CHECKOUT
      # --------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # DOCKER
      # --------------------------------------------------

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # --------------------------------------------------
      # BUILD + PUSH AUTH
      # --------------------------------------------------

      - name: Build and push Auth service
        uses: docker/build-push-action@v6
        with:
          context: ./auth-service
          file: ./auth-service/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/auth-service:latest

      # --------------------------------------------------
      # BUILD + PUSH NOTES
      # --------------------------------------------------

      - name: Build and push Notes service
        uses: docker/build-push-action@v6
        with:
          context: ./notes-service
          file: ./notes-service/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/notes-service:latest

      # --------------------------------------------------
      # BUILD + PUSH GATEWAY
      # --------------------------------------------------

      - name: Build and push Gateway
        uses: docker/build-push-action@v6
        with:
          context: ./gateway
          file: ./gateway/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/gateway:latest

      # --------------------------------------------------
      # DEPLOY TO EC2
      # --------------------------------------------------

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            set -e

            cd ~/notes-app

            echo "Pulling latest Docker images..."
            docker compose -f docker-compose.prod.yml pull

            echo "Recreating containers..."
            docker compose -f docker-compose.prod.yml up -d --force-recreate

            echo "Removing unused images..."
            docker image prune -f

            echo "Deployment completed."

            docker compose -f docker-compose.prod.yml ps
