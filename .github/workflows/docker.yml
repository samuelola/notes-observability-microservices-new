name: Build, Push and Deploy Docker Images

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'

permissions:
  contents: read

env:
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract version
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # --------------------------------------------------
      # BUILD + PUSH AUTH SERVICE
      # --------------------------------------------------

      - name: Build and push Auth service
        uses: docker/build-push-action@v6
        with:
          context: ./auth-service
          file: ./auth-service/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/auth-service:${{ steps.version.outputs.version }}
            ${{ env.DOCKERHUB_USERNAME }}/auth-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --------------------------------------------------
      # BUILD + PUSH NOTES SERVICE
      # --------------------------------------------------

      - name: Build and push Notes service
        uses: docker/build-push-action@v6
        with:
          context: ./notes-service
          file: ./notes-service/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/notes-service:${{ steps.version.outputs.version }}
            ${{ env.DOCKERHUB_USERNAME }}/notes-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --------------------------------------------------
      # BUILD + PUSH GATEWAY
      # --------------------------------------------------

      - name: Build and push Gateway
        uses: docker/build-push-action@v6
        with:
          context: ./gateway
          file: ./gateway/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/gateway:${{ steps.version.outputs.version }}
            ${{ env.DOCKERHUB_USERNAME }}/gateway:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --------------------------------------------------
      # DEPLOY TO EC2
      # --------------------------------------------------

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        env:
          IMAGE_TAG: ${{ steps.version.outputs.version }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: IMAGE_TAG
          script: |
            set -e

            cd ~/notes-app

            echo "Deploying version: ${IMAGE_TAG}"

            export IMAGE_TAG="${IMAGE_TAG}"

            echo "Pulling application images..."

            docker compose \
              -f docker-compose.prod.yml \
              pull

            echo "Starting application..."

            docker compose \
              -f docker-compose.prod.yml \
              up -d

            echo "Removing unused Docker images..."

            docker image prune -f

            echo "Deployment completed."

            docker compose \
              -f docker-compose.prod.yml \
              ps
