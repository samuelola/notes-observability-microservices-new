name: CI/CD Pipeline

on:
  push:
    branches:
      - main

##########################################################
# QUALITY CHECKS
##########################################################

jobs:

  quality:

    name: Quality - ${{ matrix.service }}

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: auth-service
            database: auth_testing

          - service: notes-service
            database: note_testing

    defaults:
      run:
        working-directory: ${{ matrix.service }}

    services:

      mysql:
        image: mysql:8.0

        env:
          MYSQL_ROOT_PASSWORD: root

        ports:
          - 3306:3306

        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:

      ##################################################
      # Checkout
      ##################################################

      - uses: actions/checkout@v4

      ##################################################
      # PHP
      ##################################################

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring,pdo_mysql,redis
          coverage: none

      ##################################################
      # Environment
      ##################################################

      - name: Copy Environment
        run: cp .env.example .env

      ##################################################
      # Composer
      ##################################################

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-progress

      ##################################################
      # Create Databases
      ##################################################

      - name: Create Test Database
        run: |
          mysql -h127.0.0.1 -uroot -proot \
          -e "CREATE DATABASE IF NOT EXISTS ${{ matrix.database }};"

      ##################################################
      # Configure Environment
      ##################################################

      - name: Configure Database
        run: |

          sed -i 's/DB_HOST=.*/DB_HOST=127.0.0.1/' .env
          sed -i 's/DB_PORT=.*/DB_PORT=3306/' .env
          sed -i 's/DB_DATABASE=.*/DB_DATABASE=${{ matrix.database }}/' .env
          sed -i 's/DB_USERNAME=.*/DB_USERNAME=root/' .env
          sed -i 's/DB_PASSWORD=.*/DB_PASSWORD=root/' .env

      ##################################################
      # Laravel
      ##################################################

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Clear Cache
        run: php artisan optimize:clear

      - name: Run Migrations
        run: php artisan migrate --force

      ##################################################
      # Code Quality
      ##################################################

      - name: Laravel Pint
        run: vendor/bin/pint --test

      ##################################################
      # Tests
      ##################################################

      - name: Unit Tests
        run: php artisan test --testsuite=Unit

      - name: Feature Tests
        run: php artisan test --testsuite=Feature

      ##################################################
      # Swagger
      ##################################################

      - name: Generate Swagger
        run: php artisan l5-swagger:generate

##########################################################
# BUILD & PUSH IMAGES
##########################################################

  docker:

    name: Docker - ${{ matrix.image }}

    needs: quality

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        include:

          - image: auth-service
            context: ./auth-service

          - image: notes-service
            context: ./notes-service

          - image: gateway
            context: .

    steps:

      ##################################################
      # Checkout
      ##################################################

      - uses: actions/checkout@v4

      ##################################################
      # Login
      ##################################################

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      ##################################################
      # Build
      ##################################################

      - name: Build Docker Image
        run: |
          docker build \
          -t ${{ secrets.DOCKER_USERNAME }}/${{ matrix.image }}:latest \
          ${{ matrix.context }}

      ##################################################
      # Push
      ##################################################

      - name: Push Docker Image
        run: |
          docker push \
          ${{ secrets.DOCKER_USERNAME }}/${{ matrix.image }}:latest