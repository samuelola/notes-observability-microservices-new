events {}

http {

    #
    # Rate limit zones
    #

    # Login: 5 requests per minute per IP
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;

    # Register: 10 requests per hour per IP
    limit_req_zone $binary_remote_addr zone=register_limit:10m rate=1r/m;

    # General API: 20 requests per second per IP
    limit_req_zone $binary_remote_addr zone=api_limit:20m rate=20r/s;

    upstream auth_service {
        server auth:8000;
    }

    upstream notes_service {
        server notes:8001;
    }

    upstream email_service {
        server email:8002;
    }

    server {

        listen 80;

        limit_req_status 429;

        error_page 429 = @rate_limit;

        location /nginx_status {

            stub_status;

        }

        #
        # =========================
        # SWAGGER DOCUMENTATION
        # =========================
        #

        # Auth Swagger

        location /api/documentation/auth {

            rewrite ^/api/documentation/auth(.*)$ /api/documentation$1 break;

            proxy_pass http://auth_service;

            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        

        # Notes Swagger

        location /api/documentation/notes {

            rewrite ^/api/documentation/notes(.*)$ /api/documentation$1 break;

            proxy_pass http://notes_service;

            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        #
        # =========================
        # FRONTEND
        # =========================
        #

        location / {
            proxy_pass http://frontend:80;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        #
        # LOGIN
        #
        location = /api/v1/auth/login {

            limit_req zone=login_limit burst=2 nodelay;

            rewrite ^/api/v1/auth/login$ /api/v1/login break;

            proxy_pass http://auth_service;

            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        #
        # REGISTER
        #
        location = /api/v1/auth/register {

            limit_req zone=register_limit burst=3 nodelay;

            rewrite ^/api/v1/auth/register$ /api/v1/register break;

            proxy_pass http://auth_service;

            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        #
        # OTHER AUTH ENDPOINTS
        #
        location /api/v1/auth {

            limit_req zone=api_limit burst=20 nodelay;

            rewrite ^/api/v1/auth/(.*)$ /api/v1/$1 break;

            proxy_pass http://auth_service;

            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        #
        # NOTES
        #
        location /api/v1/notes {

            limit_req zone=api_limit burst=50 nodelay;

            proxy_pass http://notes_service;

            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        #
        # Custom JSON response
        #
        location @rate_limit {

            default_type application/json;

            return 429 '{"status":"error","message":"Too many requests. Please try again later."}';
        }

    }
}