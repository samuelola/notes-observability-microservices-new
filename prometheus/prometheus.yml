global:
  scrape_interval: 15s

scrape_configs:

  - job_name: auth
    static_configs:
      - targets:
          - auth-service:8000

  - job_name: notes
    static_configs:
      - targets:
          - notes-service:8001

  - job_name: rabbitmq 
    static_configs:
      - targets:
          - rabbitmq-exporter:9419

  - job_name: redis
    static_configs:
      - targets:
          - redis-exporter:9121

  - job_name: cadvisor
    static_configs:
      - targets:
          - cadvisor:8080

  - job_name: nginx
    static_configs:
      - targets:
          - nginx-exporter:9113        