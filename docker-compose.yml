services:

  auth:
    build:
      context: ./auth-service
    image: auth-service:local  
    container_name: auth-service
    ports:
      - "8000:8000"
    volumes:
      - ./auth-service:/var/www  
    working_dir: /var/www
    command: php artisan serve --host=0.0.0.0 --port=8000
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy  
    networks:
      - microservices

  notes:
    build:
      context: ./notes-service
    image: notes-service:local  
    container_name: notes-service
    ports:
      - "8001:8001"
    working_dir: /var/www
    volumes:
      - ./notes-service:/var/www
    command: php artisan serve --host=0.0.0.0 --port=8001
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - microservices

  email: 
    build: 
      context: ./email-service 
    image: email-service:local 
    container_name: email-service 
    ports: 
      - "8002:8002" 
    volumes: 
      - ./email-service:/var/www 
    working_dir: /var/www 
    command: php artisan serve --host=0.0.0.0 --port=8002 
    depends_on: 
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy 
    networks: 
      - microservices 

  frontend:
    build:
      context: ./frontend 
    image: frontend:local
    container_name: frontend
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/var/www
    working_dir: /var/www
    networks:
      - microservices   


  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-proot"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s  
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - microservices


  phpmyadmin:
    image: phpmyadmin:latest
    container_name: phpmyadmin
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    depends_on:
      mysql:
        condition: service_healthy 
    networks:
      - microservices

  redisinsight:
    image: redis/redisinsight:latest
    container_name: redisinsight
    ports:
      - "5540:5540"
    volumes:
      - redisinsight_data:/data
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - microservices             


  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    networks:
      - microservices

  redis:
    image: redis:7-alpine
    container_name: redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    ports:
      - "6379:6379"
    networks:
      - microservices

  notes-consumer:
    image: notes-service:local
    container_name: notes-consumer
    working_dir: /var/www
    command: php artisan rabbitmq:consume-users
    depends_on:
      rabbitmq:
        condition: service_healthy
      mysql:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./notes-service:/var/www
    networks:
      - microservices

  notes-consumer-loggedinmsg:
    image: notes-service:local
    container_name: notes-consumer-loggedinmsg
    working_dir: /var/www
    command: php artisan rabbitmq:consume-user-logged-in
    depends_on:
      rabbitmq:
        condition: service_healthy
      mysql:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./notes-service:/var/www
    networks:
      - microservices

  email-user-consumer: 
    image: email-service:local 
    container_name: email-user-consumer 
    working_dir: /var/www 
    command: php artisan rabbitmq:consume-user-created
    depends_on: 
      email:
        condition: service_started
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped 
    volumes: 
      - ./email-service:/var/www 
    networks: 
      - microservices

  email-note-consumer: 
    image: email-service:local 
    container_name: email-note-consumer 
    working_dir: /var/www 
    command: php artisan rabbitmq:consume-note-created 
    depends_on: 
      email:
        condition: service_started
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped 
    volumes: 
      - ./email-service:/var/www 
    networks: 
      - microservices  

  mailpit:
    image: axllent/mailpit
    container_name: mailpit
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - microservices       

  notes-worker:
    image: notes-service:local
    container_name: notes-worker
    working_dir: /var/www
    command: php artisan queue:work redis --sleep=3 --tries=3 --backoff=5 --timeout=60
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "php artisan queue:monitor redis:default || exit 1"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    volumes:
      - ./notes-service:/var/www
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
    networks:
      - microservices

  email-worker: 
    image: email-service:local 
    container_name: email-worker 
    working_dir: /var/www 
    command: php artisan queue:work redis --sleep=3 --tries=3 --backoff=5 --timeout=60
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "php artisan queue:monitor redis:default || exit 1"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s 
    restart: unless-stopped 
    volumes: 
      - ./email-service:/var/www 
    depends_on: 
      email:
        condition: service_started
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy 
    networks: 
      - microservices       
  
  # =========================================================
  # API GATEWAY 
  # =========================================================

  gateway:
    build:
      context: ./gateway
    container_name: api-gateway
    ports:
      - "9000:80"
    depends_on:
      - auth
      - notes
    networks:
      - microservices

  
networks:
  microservices:
    driver: bridge

volumes:
  mysql-data:
  redisinsight_data:
