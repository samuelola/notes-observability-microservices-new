services:

  auth:
    build:
      context: ./auth-service
    image: auth-service:local  
    container_name: auth-service
    ports:
      - "8000:8000"
    volumes:
      - ./auth-service:/var/www  
    working_dir: /var/www
    command: php artisan serve --host=0.0.0.0 --port=8000
    depends_on:
      - mysql
    networks:
      - microservices

  notes:
    build:
      context: ./notes-service
    image: notes-service:local  
    container_name: notes-service
    ports:
      - "8001:8001"
    working_dir: /var/www
    volumes:
      - ./notes-service:/var/www
    command: php artisan serve --host=0.0.0.0 --port=8001
    depends_on:
      - mysql
      - rabbitmq
      - redis
    networks:
      - microservices

  frontend:
    build:
      context: ./frontend
    image: notes-frontend:local
    container_name: notes-frontend
    ports:
      - "5173:5173"
    working_dir: /var/www
    command: npm run dev
    depends_on:
      - notes
    networks:
      - microservices    

  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - microservices

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    networks:
      - microservices

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - microservices

  notes-consumer:
    image: notes-service:local
    container_name: notes-consumer
    working_dir: /var/www
    command: php artisan rabbitmq:consume-users
    depends_on:
      - rabbitmq
      - mysql
    restart: unless-stopped
    volumes:
      - ./notes-service:/var/www
    networks:
      - microservices

  notes-consumer-loggedinmsg:
    image: notes-service:local
    container_name: notes-consumer-loggedinmsg
    working_dir: /var/www
    command: php artisan rabbitmq:consume-user-logged-in
    depends_on:
      - rabbitmq
      - mysql
    restart: unless-stopped
    volumes:
      - ./notes-service:/var/www
    networks:
      - microservices

  notes-worker:
    image: notes-service:local
    container_name: notes-worker
    working_dir: /var/www
    command: php artisan queue:work redis --tries=3 --timeout=90
    restart: unless-stopped
    volumes:
      - ./notes-service:/var/www
    depends_on:
      - redis
      - mysql
    networks:
      - microservices

  gateway:
    build:
      context: ./gateway
    container_name: api-gateway
    ports:
      - "9000:80"
    depends_on:
      - auth
      - notes
    networks:
      - microservices

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.5.1
    container_name: nginx-exporter
    command:
      - -nginx.scrape-uri=http://api-gateway/nginx_status
    ports:
      - "9113:9113"
    depends_on:
      - gateway
    networks:
      - microservices

  rabbitmq-exporter:
    image: kbudde/rabbitmq-exporter
    environment:
      RABBIT_URL: http://rabbitmq:15672
      RABBIT_USER: guest
      RABBIT_PASSWORD: guest
    ports:
      - "9419:9419"
    depends_on:
      - rabbitmq
    networks:
      - microservices           


networks:
  microservices:
    driver: bridge

volumes:
  mysql-data:
