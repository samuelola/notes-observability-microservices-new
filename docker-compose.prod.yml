version: "3.9"

services:

  auth:
    image: sammy48/auth-service:latest
    container_name: auth-service
    restart: unless-stopped
    env_file:
      - ./auth-service/.env
    expose:
      - "9000"
    depends_on:
      - auth-db
    networks:
      - microservices

  notes:
    image: sammy48/notes-service:latest
    container_name: notes-service
    restart: unless-stopped
    env_file:
      - ./notes-service/.env
    expose:
      - "9000"
    depends_on:
      - notes-db
      - rabbitmq
      - redis
    networks:
      - microservices

  gateway:
    image: sammy48/gateway:latest
    container_name: api-gateway
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - auth
      - notes
    networks:
      - microservices

  auth-nginx:
    image: nginx:alpine
    container_name: auth-nginx
    restart: unless-stopped
    expose:
      - "80"
    volumes:
      - ./auth-service:/var/www
      - ./auth-service/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - auth
    networks:
      - microservices  

  notes-nginx:
    image: nginx:alpine
    container_name: notes-nginx
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - notes
    volumes:
      - ./notes-service:/var/www
      - ./notes-service/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf 
    networks:
      - microservices       

  auth-db:
    image: mysql:8.0
    container_name: auth-db
    restart: unless-stopped
    env_file:
      - ./auth-service/.env
    volumes:
      - auth-db-data:/var/lib/mysql
    networks:
      - microservices

  notes-db:
    image: mysql:8.0
    container_name: notes-db
    restart: unless-stopped
    env_file:
      - ./notes-service/.env
    volumes:
      - notes-db-data:/var/lib/mysql
    networks:
      - microservices

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    networks:
      - microservices

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - microservices

  notes-worker:
    image: yourdockerhub/notes-service:latest
    container_name: notes-worker
    restart: unless-stopped
    command: php artisan queue:work redis --tries=3 --timeout=90
    depends_on:
      - redis
      - rabbitmq
    networks:
      - microservices

  notes-consumer:
    image: yourdockerhub/notes-service:latest
    container_name: notes-consumer
    restart: unless-stopped
    command: php artisan rabbitmq:consume-users
    depends_on:
      - rabbitmq
    networks:
      - microservices

  notes-consumer-loggedinmsg:
    image: yourdockerhub/notes-service:latest
    container_name: notes-consumer-loggedinmsg
    restart: unless-stopped
    command: php artisan rabbitmq:consume-user-logged-in
    depends_on:
      - rabbitmq
    networks:
      - microservices

  loki:
    image: grafana/loki:2.9.8
    container_name: loki
    restart: unless-stopped
    volumes:
      - ./loki-config.yml:/etc/loki/local-config.yaml
    networks:
      - microservices

  promtail:
    image: grafana/promtail:2.9.8
    container_name: promtail
    restart: unless-stopped
    volumes:
      - ./promtail-config.yml:/etc/promtail/config.yml
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/log:/var/log:ro
    networks:
      - microservices

  prometheus:
    image: prom/prometheus
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - microservices

  grafana:
    image: grafana/grafana
    container_name: grafana
    restart: unless-stopped
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - microservices

  jaeger:
    image: jaegertracing/all-in-one:1.58
    container_name: jaeger
    restart: unless-stopped
    networks:
      - microservices

networks:
  microservices:

volumes:
  auth-db-data:
  notes-db-data:
  rabbitmq-data:
  redis-data:
  grafana-data: